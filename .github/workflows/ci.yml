name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import reusable modules
        run: >-
          python -c "import chat_history, config;
          import ingestion.chunker, ingestion.whisper_loader, ingestion.youtube_loader;
          import retrieval.embeddings, retrieval.vector_store;
          import llm.groq_client, llm.rag, llm.summarizer"